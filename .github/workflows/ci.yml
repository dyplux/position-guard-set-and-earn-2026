name: Read-only candidate checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
  codecs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: read_only/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: read_only
      - run: node --test test_mainnet_unsigned.cjs test_negotiation.cjs test_submission.cjs test_quote_grant.cjs test_funding.cjs test_seller_submit_guard.cjs test_seller_submit_io.cjs test_seller_submit_preflight.cjs test_seller_submit_execution.cjs test_seller_submit_cli.cjs test_seller_reconcile.cjs
